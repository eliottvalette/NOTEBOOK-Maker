# Common components
components:
  standard_imports: &standard_imports
    - type: "code"
      content: |
        # Import necessary libraries
        import pandas as pd
        import numpy as np
        import matplotlib.pyplot as plt
        import seaborn as sns
        
        # Configuration to display graphs in the notebook
        %matplotlib inline
        plt.style.use('ggplot')
        sns.set(style='whitegrid')
  
  data_loading_csv: &data_loading_csv
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Data Loading and Initial Exploration <span style='color:#F1A424'>|</span></b>
        Load your dataset and get a first look at its structure and contents.
    - type: "code"
      content: |
        # Load the dataset
        df = pd.read_csv('$filename$')
        
        # Display basic information
        print("Table shape:", df.shape)
        print("Column names:", df.columns.tolist())
        df.head()

  data_loading_excel: &data_loading_excel
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Excel Data Loading and Initial Exploration <span style='color:#F1A424'>|</span></b>
        Load your Excel file and preview its structure and columns.
    - type: "code"
      content: |
        # Load the dataset
        df = pd.read_excel('$filename$')

        # Display basic information
        print("Table shape:", df.shape)
        print("Column names:", df.columns.tolist())
        df.head()
    
  data_loading_parquet: &data_loading_parquet
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Parquet Data Loading and Initial Exploration <span style='color:#F1A424'>|</span></b>
        Load your Parquet file and examine its basic properties.
    - type: "code"
      content: |
        # Load the Parquet dataset
        df = pd.read_parquet('$filename$')

        # Display basic information
        print("Table shape:", df.shape)
        print("Column names:", df.columns.tolist())
        df.head()
  
  data_loading_json: &data_loading_json
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> JSON Data Loading and Initial Exploration <span style='color:#F1A424'>|</span></b>
        Load your JSON data and inspect its structure and columns.
    - type: "code"
      content: |
        # Load the JSON dataset
        df = pd.read_json('$filename$', lines=True)  # set lines=False for pure JSON

        # Display basic information
        print("Table shape:", df.shape)
        print("Column names:", df.columns.tolist())
        df.head()
    
  data_loading_sql: &data_loading_sql
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> SQL Table Loading and Initial Exploration <span style='color:#F1A424'>|</span></b>
        Connect to your SQL database and load a table for analysis.
    - type: "code"
      content: |
        from sqlalchemy import create_engine

        # e.g. engine = create_engine('postgresql://user:pass@host/dbname')
        engine = create_engine('$sql_connection_string$')
        df = pd.read_sql_table('$table_name$', con=engine)

        print("Table shape:", df.shape)
        print("Column names:", df.columns.tolist())
        df.head()

  multiple_csv_loading: &multiple_csv_loading
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Loading Multiple CSV Files <span style='color:#F1A424'>|</span></b>
        Load several CSV files at once and review their basic information.
    - type: "code"
      content: |
        # Load all CSV files into a dictionary of DataFrames
        dataframes = {}

        for csv_filename in $filenames_list$:
            dataframes[csv_filename] = pd.read_csv(csv_filename)
            print(f"Table {csv_filename} shape: {dataframes[csv_filename].shape}")
            print(f"Column names: {dataframes[csv_filename].columns.tolist()}")
        
        # Display the list of loaded DataFrames
        list(dataframes.keys())

  merge_on_common_id: &merge_on_common_id
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Merging DataFrames on Common ID <span style='color:#F1A424'>|</span></b>
        Combine multiple tables into one by joining on a shared identifier column.
    - type: "code"
      content: |
        # Merge all DataFrames on the common ID column
        merged_df = None
        
        for df_name, df in dataframes.items():
            if "$common_id_column$" not in df.columns:
                print(f"Warning: The column '$common_id_column$' is not present in {df_name}, this file will be ignored")
                continue
                
            if merged_df is None:
                merged_df = df.copy()
            else:
                # Use a suffix to avoid column name duplication
                merged_df = pd.merge(merged_df, df, on="$common_id_column$", how='outer', 
                                    suffixes=('', f'_{df_name}'))
        # Standardize merged df
        df = merged_df

        # Display information about the merged DataFrame
        print("Final DataFrame shape:", df.shape)
        print("Final DataFrame columns:", df.columns.tolist())
        print("\nMerged DataFrame preview:")
        df.head()

  categorical_encoding: &categorical_encoding
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Categorical Data Encoding <span style='color:#F1A424'>|</span></b>
        Convert categorical variables into numeric codes for analysis.
    - type: "code"
      content: |
        # Transform categorical columns to numerical
        from sklearn.preprocessing import LabelEncoder
        label_encoders = {}
        for col in df.select_dtypes(include=['object', 'category']).columns:
            le = LabelEncoder()
            df[col] = le.fit_transform(df[col])
            label_encoders[col] = le
        print("\nDataFrame after categorical encoding:")
        df.head()

  correlation_analysis: &correlation_analysis
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Correlation Analysis <span style='color:#F1A424'>|</span></b>
        Analyze the relationships between features to inform feature selection.
        We are using the absolute value of the correlation matrix to get insight on the magnitude of the correlation between the features, as the sign of the correlation is not important for the feature selection step.
    - type: "code"
      content: |
        # Display correlation matrix
        corr_matrix = df.corr().abs()
        plt.figure(figsize=(12, 8))
        sns.heatmap(corr_matrix, cmap='inferno', vmin=0, vmax=1)
        plt.title('Correlation Matrix')
        plt.show()
        

# Main decision tree
decision_tree_preprocessing:
  - if: Tabular data only
    then:
      actions:
        - if: One table
          then:
            actions:
              - if: CSV
                then:
                  actions:
                    - if: Has headers
                      then:
                        actions:
                          - leaf_id: 1
                            cell_title: "Process Single Table"
                            arguments: ['filename']
                            cell_content:
                              - *standard_imports
                              - *data_loading_csv
                              - *categorical_encoding
                              - *correlation_analysis
                      else:
                        actions:
                          - leaf_id: 2
                            cell_title: "Process Single Table"
                            arguments: ['filename']
                            cell_content:
                              - *standard_imports
                              - *data_loading_csv
                              - *categorical_encoding
                              - *correlation_analysis
              - if: Excel
                then:
                  actions:
                    - if: Multiple sheets
                      then:
                        actions:
                          - leaf_id: 3
                            cell_title: "Error, Should have said multiple tables"
                            error: true
                      else:
                        actions:
                          - leaf_id: 4
                            cell_title: "Process Excel Table"
                            arguments: ['filename']
                            cell_content:
                              - *standard_imports
                              - *data_loading_excel
                              - *categorical_encoding
                              - *correlation_analysis
              - if: Parquet
                then:
                  actions:
                    - leaf_id: 5
                      cell_title: "Process Parquet Table"
                      arguments: ['filename']
                      cell_content:
                        - *standard_imports
                        - *data_loading_parquet
                        - *categorical_encoding
                        - *correlation_analysis

              - if: JSON
                then:
                  actions:
                    - leaf_id: 6
                      cell_title: "Process JSON Table"
                      arguments: ['filename']
                      cell_content:
                        - *standard_imports
                        - *data_loading_json
                        - *categorical_encoding
                        - *correlation_analysis

              - if: SQL
                then:
                  actions:
                    - leaf_id: 7
                      cell_title: "Process SQL Table"
                      arguments: ['sql_connection_string', 'table_name']
                      cell_content:
                        - *standard_imports
                        - *data_loading_sql
                        - *categorical_encoding
                        - *correlation_analysis

        - if: Multiple tables
          then:
            actions:
              - if: All CSV
                then:
                  actions:
                    - if: Can join on common ID
                      then:
                        actions:
                          - leaf_id: 8
                            cell_title: "Merge CSVs on Common ID"
                            arguments: ["filenames_list", "common_id_column"]
                            cell_content: 
                              - *standard_imports
                              - *multiple_csv_loading
                              - *merge_on_common_id
                              - *categorical_encoding
                              - *correlation_analysis
                    - if: All have same row count
                      then:
                        actions:
                          - leaf_id: 9
                            cell_title: "Merge CSVs By Concatenation"
                            arguments: ["filenames_list"]
                            cell_content:
                              - *standard_imports
                              - *multiple_csv_loading
                              - *merge_on_common_id
                              - *categorical_encoding
                              - *correlation_analysis
                              - type: "code"
                                content: |
                                  # Not supported yet
                    - if: No common ID and not all have same row count
                      then:
                        actions:
                          - leaf_id: 10
                            cell_title: "Multiple CSVs Without Join Possible"
                            arguments: ["filenames_list"]
                            cell_content:
                              - *standard_imports
                              - type: "markdown"
                                content: |
                                  # Not supported yet

              - if: Excel with multiple sheets
                then:
                  actions:
                    - leaf_id: 11
                      cell_title: "Process Excel with Multiple Sheets"
                      arguments: []
                      cell_content: 
                        - *standard_imports
                        - type: "markdown"
                          content: |
                            # Not supported Yet

              - if: Mixed formats (CSV + Excel)
                then:
                  actions:
                    - leaf_id: 12
                      cell_title: "Mixed File Types Preprocessing"
                      arguments: ["filenames_list"]
                      cell_content:
                        - *standard_imports
                        - type: "markdown"
                          content: |
                            # Not supported Yet
  - if: Images only
    then:
      actions:
        - if: JPEG format
          then:
            actions:
              - leaf_id: 13
                cell_title: "Process JPEG Images"
                arguments: ["image_folder"]
                cell_content: [...]

        - if: PNG format
          then:
            actions:
              - leaf_id: 14
                cell_title: "Process PNG Images"
                arguments: ["image_folder"]
                cell_content: [...]

  - if: Images and tabular data
    then:
      actions:
        - if: Images mapped to tabular rows
          then:
            actions:
              - leaf_id: 15
                cell_title: "Multimodal Preprocessing"
                arguments: ["filename", "image_folder"]
                cell_content: [...]
              