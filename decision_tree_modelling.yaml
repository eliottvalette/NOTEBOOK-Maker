decision_tree_modelling:
  - if: data_type == "Tabular data only"
    then:
      actions:
        - if: Multiclass classification
          then:
            actions:
              - leaf_id: 1
                cell_title: "Random Forest"
                arguments: ['num_classes', 'target_column']
                cell_content: 
                  - type: "code"
                    content: |
                      import xgboost as xgb
                      import torch
                      import torch.nn as nn
                      import torch.optim as optim
                      from sklearn.model_selection import train_test_split
                      from sklearn.metrics import accuracy_score
                      
                  - type: "code"
                    content: |
                      target_column = "$target_column$"
                      num_classes = $num_classes$

                      X_train, X_test, y_train, y_test = train_test_split(df.drop(columns=[target_column]), df[target_column], test_size=0.2, random_state=42)

                      # Create DMatrix for XGBoost
                      dtrain = xgb.DMatrix(X_train, label=y_train)
                      dtest = xgb.DMatrix(X_test, label=y_test)

                      # Set parameters for XGBoost
                      params = {
                          'objective': 'multi:softmax',
                          'num_class': num_classes,
                          'max_depth': 6,
                          'eta': 0.3,
                          'eval_metric': 'mlogloss'
                      }

                      # Train the model
                      num_rounds = 100
                      model = xgb.train(params, dtrain, num_rounds)

                  - type: "code"
                    content: |
                      # Make predictions
                      y_pred = model.predict(dtest)

                      # Evaluate the model
                      accuracy = accuracy_score(y_test, y_pred)
                      print(f"Accuracy: {accuracy}")
                      
                  
        - if: Regression
          then:
            actions:
              - leaf_id: 2
                cell_title: "Neural Network"
                arguments: ['target_column']
                cell_content:

                  - type: "code"
                    content: |
                      # Import necessary libraries
                      import torch
                      import torch.nn as nn
                      import torch.optim as optim
                      from sklearn.model_selection import train_test_split
                      from sklearn.metrics import mean_squared_error

                  - type: "code"
                    content: |
                      # Create The Neural Network Model
                      class NeuralNetModel(nn.Module):
                          def __init__(self, input_size):
                              super(NeuralNetModel, self).__init__()
                              self.fc1 = nn.Linear(input_size, 64)
                              self.fc2 = nn.Linear(64, 32)
                              self.fc3 = nn.Linear(32, 1)
                              self.relu = nn.ReLU()
                          
                          def forward(self, x):
                              x = self.relu(self.fc1(x))
                              x = self.relu(self.fc2(x))
                              x = self.fc3(x)
                              return x
                  - type: "code"
                    content: |
                      # Regression with Neural Network
                      target_column = "$target_column$"
                      
                      X_train, X_test, y_train, y_test = train_test_split(df.drop(columns=[target_column]), df[target_column], test_size=0.2, random_state=42)

                      # Convert data to tensors
                      X_train_tensor = torch.FloatTensor(X_train.values)
                      y_train_tensor = torch.FloatTensor(y_train.values).reshape(-1, 1)
                      X_test_tensor = torch.FloatTensor(X_test.values)
                      y_test_tensor = torch.FloatTensor(y_test.values).reshape(-1, 1)
                  
                  - type: "code"
                    content: |
                      # Initialize model, loss function and optimizer
                      input_size = X_train.shape[1]
                      model = NeuralNetModel(input_size)
                      criterion = nn.MSELoss()
                      optimizer = optim.Adam(model.parameters(), lr=0.001)
                      
                      # Training loop
                      num_epochs = 100
                      for epoch in range(num_epochs):
                          # Forward pass
                          outputs = model(X_train_tensor)
                          loss = criterion(outputs, y_train_tensor)
                          
                          # Backward and optimize
                          optimizer.zero_grad()
                          loss.backward()
                          optimizer.step()
                          
                          if (epoch+1) % 10 == 0:
                              print(f'Epoch [{epoch+1}/{num_epochs}], Loss: {loss.item():.4f}')

                  - type: "code"
                    content: |
                      # Evaluate the model
                      model.eval()
                      with torch.no_grad():
                          y_pred = model(X_test_tensor)
                          test_loss = criterion(y_pred, y_test_tensor)
                          print(f'Test Loss: {test_loss.item():.4f}')

        - if : Time series forecasting
          then:
            actions:
              - leaf_id: 3
                cell_title: "LSTM"
                arguments: ['target_column']
                cell_content:
                  - type: "code"
                    content: |
                      # Import necessary libraries
                      import torch
                      import torch.nn as nn
                      import torch.optim as optim
                      from sklearn.model_selection import train_test_split

                  - type: "code"
                    content: |
                      target_column = "$target_column$"

                      X_train, X_test, y_train, y_test = train_test_split(df.drop(columns=[target_column]), df[target_column], test_size=0.2, random_state=42)

                  - type: "code"
                    content: |
                      class LSTMModel(nn.Module):
                          def __init__(self, input_size, hidden_size, output_size):
                              super(LSTMModel, self).__init__()
                              self.lstm = nn.LSTM(input_size, hidden_size, batch_first=True)
                              self.fc = nn.Linear(hidden_size, output_size)

                          def forward(self, x):
                              lstm_out, _ = self.lstm(x)
                              out = self.fc(lstm_out[:, -1, :])
                              return out

                  - type: "code"
                    content: |
                      # Initialize model, loss function and optimizer
                      input_size = X_train.shape[1]
                      hidden_size = 64
                      output_size = 1
                      model = LSTMModel(input_size, hidden_size, output_size)
                      criterion = nn.MSELoss()
                      optimizer = optim.Adam(model.parameters(), lr=0.001)

                  - type: "code"
                    content: |
                      # Training loop
                      num_epochs = 100
                      for epoch in range(num_epochs):
                          # Forward pass
                          outputs = model(X_train_tensor)
                          loss = criterion(outputs, y_train_tensor)
                          
                          # Backward and optimize
                          optimizer.zero_grad()
                          loss.backward()
                          optimizer.step()
                          
                          if (epoch+1) % 10 == 0:
                              print(f'Epoch [{epoch+1}/{num_epochs}], Loss: {loss.item():.4f}')

                  - type: "code"
                    content: |
                      # Evaluate the model
                      model.eval()
                      with torch.no_grad():
                          y_pred = model(X_test_tensor)
                          test_loss = criterion(y_pred, y_test_tensor)
                          print(f'Test Loss: {test_loss.item():.4f}')

  - if: "No tabular data"
    then:
      actions:
        - leaf_id: 4
          cell_title: "Not supported Yet"
