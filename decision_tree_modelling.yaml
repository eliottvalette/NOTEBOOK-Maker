decision_tree_modelling:
  - if: Tabular data only
    then:
      actions:
        - if: Multiclass classification
          then:
            actions:
              - leaf_id: 1
                cell_title: "Random Forest"
                arguments: ['num_classes', 'target_column']
                cell_content: 
                  - type: "code"
                    content: |
                      import xgboost as xgb
                      import torch
                      import torch.nn as nn
                      import torch.optim as optim
                      from sklearn.model_selection import train_test_split
                      from sklearn.metrics import accuracy_score
                      
                  - type: "code"
                    content: |
                      target_column = "$target_column$"
                      num_classes = $num_classes$

                      X_train, X_test, y_train, y_test = train_test_split(df.drop(columns=[target_column]), df[target_column], test_size=0.2, random_state=42)

                      # Create DMatrix for XGBoost
                      dtrain = xgb.DMatrix(X_train, label=y_train)
                      dtest = xgb.DMatrix(X_test, label=y_test)

                      # Set parameters for XGBoost
                      params = {
                          'objective': 'multi:softmax',
                          'num_class': num_classes,
                          'max_depth': 6,
                          'eta': 0.3,
                          'eval_metric': 'mlogloss'
                      }

                      # Train the model
                      num_rounds = 100
                      model = xgb.train(params, dtrain, num_rounds)

                  - type: "code"
                    content: |
                      # Make predictions
                      y_pred = model.predict(dtest)

                      # Evaluate the model
                      accuracy = accuracy_score(y_test, y_pred)
                      print(f"Accuracy: {accuracy}")
                      
                  
        - if: Regression
          then:
            actions:
              - leaf_id: 2
                cell_title: "Neural Network"
                arguments: ['target_column']
                cell_content:

                  - type: "code"
                    content: |
                      # Import necessary libraries
                      import torch
                      import torch.nn as nn
                      import torch.optim as optim
                      from sklearn.model_selection import train_test_split
                      from sklearn.metrics import mean_squared_error

                  - type: "code"
                    content: |
                      # Create The Neural Network Model
                      class NeuralNetModel(nn.Module):
                          def __init__(self, input_size):
                              super(NeuralNetModel, self).__init__()
                              self.fc1 = nn.Linear(input_size, 64)
                              self.fc2 = nn.Linear(64, 32)
                              self.fc3 = nn.Linear(32, 1)
                              self.relu = nn.ReLU()
                          
                          def forward(self, x):
                              x = self.relu(self.fc1(x))
                              x = self.relu(self.fc2(x))
                              x = self.fc3(x)
                              return x
                  - type: "code"
                    content: |
                      # Regression with Neural Network
                      target_column = "$target_column$"
                      
                      X_train, X_test, y_train, y_test = train_test_split(df.drop(columns=[target_column]), df[target_column], test_size=0.2, random_state=42)

                      # Convert data to tensors
                      X_train_tensor = torch.FloatTensor(X_train.values)
                      y_train_tensor = torch.FloatTensor(y_train.values).reshape(-1, 1)
                      X_test_tensor = torch.FloatTensor(X_test.values)
                      y_test_tensor = torch.FloatTensor(y_test.values).reshape(-1, 1)
                  
                  - type: "code"
                    content: |
                      # Initialize model, loss function and optimizer
                      input_size = X_train.shape[1]
                      model = NeuralNetModel(input_size)
                      criterion = nn.MSELoss()
                      optimizer = optim.Adam(model.parameters(), lr=0.001)
                      
                      # Training loop
                      num_epochs = 100
                      for epoch in range(num_epochs):
                          # Forward pass
                          outputs = model(X_train_tensor)
                          loss = criterion(outputs, y_train_tensor)
                          
                          # Backward and optimize
                          optimizer.zero_grad()
                          loss.backward()
                          optimizer.step()
                          
                          if (epoch+1) % 10 == 0:
                              print(f'Epoch [{epoch+1}/{num_epochs}], Loss: {loss.item():.4f}')

                  - type: "code"
                    content: |
                      # Evaluate the model
                      model.eval()
                      with torch.no_grad():
                          y_pred = model(X_test_tensor)
                          test_loss = criterion(y_pred, y_test_tensor)
                          print(f'Test Loss: {test_loss.item():.4f}')

        - if : Time series forecasting
          then:
            actions:
              - leaf_id: 3
                cell_title: "LSTM"
                arguments: ['target_column']
                cell_content:
                  - type: "code"
                    content: |
                      # Import necessary libraries
                      import torch
                      import torch.nn as nn
                      import torch.optim as optim
                      import numpy as np
                      import pandas as pd
                      from sklearn.model_selection import train_test_split
                      from sklearn.preprocessing import StandardScaler

                  - type: "code"
                    content: |
                      target_column = "$target_column$"

                      X_train, X_test, y_train, y_test = train_test_split(df.drop(columns=[target_column]), df[target_column], test_size=0.2, random_state=42)
                      
                      # Function to create sequences for time series forecasting
                      def create_sequences(X, y, seq_length):
                          xs, ys = [], []
                          for i in range(len(X) - seq_length):
                              xs.append(X.iloc[i:i+seq_length].values)
                              ys.append(y.iloc[i+seq_length])
                          return np.array(xs), np.array(ys)
                      
                      # Define sequence length for LSTM
                      seq_length = 10  # Number of time steps to look back
                      
                      # Create sequences for training and test sets
                      X_train_seq, y_train_seq = create_sequences(X_train, y_train, seq_length)
                      X_test_seq, y_test_seq = create_sequences(X_test, y_test, seq_length)
                      
                      # Convert data to tensors
                      X_train_tensor = torch.FloatTensor(X_train_seq)  # Shape: [batch_size, seq_length, features]
                      y_train_tensor = torch.FloatTensor(y_train_seq).reshape(-1, 1)
                      X_test_tensor = torch.FloatTensor(X_test_seq)
                      y_test_tensor = torch.FloatTensor(y_test_seq).reshape(-1, 1)
                      
                      print(f"Training data shape: {X_train_tensor.shape} - X, {y_train_tensor.shape} - y")
                      print(f"Test data shape: {X_test_tensor.shape} - X, {y_test_tensor.shape} - y")

                  - type: "code"
                    content: |
                      # Import numpy and pandas for sequence creation
                      import numpy as np
                      import pandas as pd

                  - type: "code"
                    content: |
                      class LSTMModel(nn.Module):
                          def __init__(self, input_size, hidden_size, output_size, num_layers=2):
                              super(LSTMModel, self).__init__()
                              self.hidden_size = hidden_size
                              self.num_layers = num_layers
                              
                              # LSTM with multiple layers
                              self.lstm = nn.LSTM(input_size, hidden_size, num_layers=num_layers, 
                                                batch_first=True, dropout=0.2)
                              
                              # Fully connected layer
                              self.fc = nn.Linear(hidden_size, output_size)

                          def forward(self, x):
                              # Initialize hidden state with zeros
                              batch_size = x.size(0)
                              h0 = torch.zeros(self.num_layers, batch_size, self.hidden_size).to(x.device)
                              c0 = torch.zeros(self.num_layers, batch_size, self.hidden_size).to(x.device)
                              
                              # Forward propagate LSTM
                              lstm_out, _ = self.lstm(x, (h0, c0))  # lstm_out shape: [batch_size, seq_length, hidden_size]
                              
                              # Get the output from the last time step
                              out = self.fc(lstm_out[:, -1, :])
                              return out

                  - type: "code"
                    content: |
                      # Initialize model, loss function and optimizer
                      input_size = X_train_seq.shape[2]  # Number of features
                      hidden_size = 64
                      output_size = 1
                      num_layers = 2
                      model = LSTMModel(input_size, hidden_size, output_size, num_layers)
                      criterion = nn.MSELoss()
                      optimizer = optim.Adam(model.parameters(), lr=0.001)
                      
                      # Create mini-batches for training
                      from torch.utils.data import TensorDataset, DataLoader
                      train_dataset = TensorDataset(X_train_tensor, y_train_tensor)
                      batch_size = 64
                      train_loader = DataLoader(dataset=train_dataset, batch_size=batch_size, shuffle=True)

                  - type: "code"
                    content: |
                      # Training loop
                      num_epochs = 100
                      best_loss = float('inf')
                      patience = 10
                      counter = 0
                      
                      # For tracking metrics
                      train_losses = []
                      
                      for epoch in range(num_epochs):
                          model.train()
                          epoch_loss = 0
                          
                          for batch_X, batch_y in train_loader:
                              # Forward pass
                              outputs = model(batch_X)
                              loss = criterion(outputs, batch_y)
                              
                              # Backward and optimize
                              optimizer.zero_grad()
                              loss.backward()
                              # Optional gradient clipping to prevent exploding gradients
                              torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)
                              optimizer.step()
                              
                              epoch_loss += loss.item()
                          
                          # Calculate average loss for the epoch
                          avg_loss = epoch_loss / len(train_loader)
                          train_losses.append(avg_loss)
                          
                          # Early stopping
                          if avg_loss < best_loss:
                              best_loss = avg_loss
                              counter = 0
                              # Save the model
                              torch.save(model.state_dict(), 'best_lstm_model.pth')
                          else:
                              counter += 1
                          
                          if counter >= patience:
                              print(f'Early stopping triggered at epoch {epoch+1}')
                              break
                          
                          if (epoch+1) % 5 == 0:
                              print(f'Epoch [{epoch+1}/{num_epochs}], Loss: {avg_loss:.4f}')
                      
                      # Load the best model
                      model.load_state_dict(torch.load('best_lstm_model.pth'))

                  - type: "code"
                    content: |
                      # Evaluate the model
                      model.eval()
                      with torch.no_grad():
                          # Make predictions
                          test_predictions = model(X_test_tensor)
                          test_loss = criterion(test_predictions, y_test_tensor)
                          
                          # Calculate metrics
                          from sklearn.metrics import mean_squared_error, mean_absolute_error, r2_score
                          
                          y_pred = test_predictions.numpy().flatten()
                          y_true = y_test_tensor.numpy().flatten()
                          
                          mse = mean_squared_error(y_true, y_pred)
                          rmse = np.sqrt(mse)
                          mae = mean_absolute_error(y_true, y_pred)
                          r2 = r2_score(y_true, y_pred)
                          
                          print(f'Test Loss: {test_loss.item():.4f}')
                          print(f'MSE: {mse:.4f}')
                          print(f'RMSE: {rmse:.4f}')
                          print(f'MAE: {mae:.4f}')
                          print(f'R² Score: {r2:.4f}')

  - if: "No tabular data"
    then:
      actions:
        - leaf_id: 4
          cell_title: "Not supported Yet"
          arguments: []
          cell_content:
            - type: "markdown"
              content: |
