<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notebook Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="badge">Notebook Innovation</div>
        <h1><span>Notebook</span> Maker</h1>
        <p class="subtitle">Generate smart notebooks from your data</p>
        <form id="uploadForm">
            <label for="dataset" class="form-label">Upload Dataset</label>
            <input type="file" id="dataset" name="dataset" required>
            <label for="style" class="form-label">Dataset Style</label>
            <select id="style" name="style">
                <option value="A_1_one_csv">A_1_one_csv</option>
                <option value="B_2_joinable_csvs">B_2_joinable_csvs</option>
                <option value="C_1_csv_time_series">C_1_csv_time_series</option>
            </select>
            <div class="form-actions">
                <button type="submit" class="btn primary">Run Pipeline</button>
            </div>
        </form>
        <div id="result"></div>
    </main>
    <script src="main.js"></script>
</body>
</html>
