form_questions:
  - id: data_type
    question: "Quelle est la nature de vos données ?"
    type: select
    options:
      - "Données tabulaires uniquement"
      - "Images et données tabulaires"
      - "Images uniquement"

  - id: table_count
    question: "Combien de tables avez-vous ?"
    type: select
    options:
      - "Une table"
      - "Plusieurs tables"
    depends_on: data_type == "Données tabulaires uniquement"

  - id: multiple_tables_format
    question: "Quel est le format de vos tables ?"
    type: select
    options:
      - "CSVs"
      - "Excel avec plusieurs feuilles"
    depends_on: table_count == "Plusieurs tables"

  - id: csv_join_possibility
    question: "Est-ce que les CSVs peuvent être joints ?"
    type: select
    options:
      - "Tous peuvent être joints sur une colonne ID commune"
      - "Impossibles à joindre"
    depends_on: multiple_tables_format == "CSVs"

  - id: common_id_column
    question: "Quel est le nom de la colonne ID commune ?"
    type: string
    depends_on: csv_join_possibility == "Tous peuvent être joints sur une colonne ID commune"

decision_tree:
  - if: data_type == "Données tabulaires uniquement"
    then:
      actions:
        - if: table_count == "Une table"
          then:
            actions:
              - generate_cell: "process_single_table"
        - if: table_count == "Plusieurs tables"
          then:
            actions:
              - if: multiple_tables_format == "CSVs"
                then:
                  actions:
                    - if: csv_join_possibility == "Tous peuvent être joints sur une colonne ID commune"
                      then:
                        actions:
                          - generate_cell: "merge_csvs_with_common_id"
                    - if: csv_join_possibility == "Impossibles à joindre"
                      then:
                        actions:
                          - generate_cell: "ask_user_to_fix_csv_problem"
              - if: multiple_tables_format == "Excel avec plusieurs feuilles"
                then:
                  actions:
                    - generate_cell: "process_excel_multiple_sheets"

  - if: data_type == "Images et données tabulaires"
    then:
      actions:
        - generate_cell: "process_images_and_tabular_data"

  - if: data_type == "Images uniquement"
    then:
      actions:
        - generate_cell: "process_images_only" 