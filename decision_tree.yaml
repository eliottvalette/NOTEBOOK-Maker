form_questions:
  - id: has_several_csvs
    question: "Avez-vous plusieurs fichiers CSV ?"
    type: boolean

  - id: number_of_csvs
    question: "Combien de fichiers CSV avez-vous ?"
    type: integer
    depends_on: has_several_csvs == true

  - id: csv_names
    question: "Quels sont les noms de vos fichiers CSV ?"
    type: array
    depends_on: has_several_csvs == true

  - id: has_common_id
    question: "Vos fichiers CSV ont-ils une colonne ID commune ?"
    type: boolean
    depends_on: has_several_csvs == true

  - id: common_id_column
    question: "Quel est le nom de la colonne ID commune ?"
    type: string
    depends_on: has_common_id == true

  - id: target_column
    question: "Quelle est la colonne cible à prédire ?"
    type: string

  - id: wants_binary_prediction
    question: "Souhaitez-vous faire des prédictions binaires ?"
    type: boolean

  - id: wants_gradboost
    question: "Souhaitez-vous utiliser un modèle Gradient Boosting ?"
    type: boolean

  - id: wants_classification_metrics
    question: "Souhaitez-vous voir les métriques de classification ?"
    type: boolean
    depends_on: wants_binary_prediction == true

  - id: wants_regression_metrics
    question: "Souhaitez-vous voir les métriques de régression ?"
    type: boolean

decision_tree:
  - if: has_several_csvs == true && has_common_id == true
    then:
      actions:
        - generate_cell: "merge_datasets"

  - if: wants_binary_prediction == true
    then:
      actions:
        - generate_cell: "prepare_and_train_model"

  - if: wants_gradboost == true
    then:
      actions:
        - generate_cell: "train_gradboost"

  - if: wants_classification_metrics == true
    then:
      actions:
        - generate_cell: "classification_metrics"

  - if: wants_regression_metrics == true
    then:
      actions:
        - generate_cell: "regression_metrics"

  - if: target_column != null
    then:
      actions:
        - generate_cell: "feature_importance"

  - if: has_several_csvs == true
    then:
      actions:
        - generate_cell: "compare_datasets" 