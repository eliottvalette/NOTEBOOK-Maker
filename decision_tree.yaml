decision_tree:
  - if: data_type == "Tabular data only"
    then:
      actions:
        - if: table_count == "One table"
          then:
            actions:
              - leaf_id: 1
                cell_title: "Process Single Table"
                cell_content: |
                  # Process a single table
                  print("Processing a single table...")
                  
                  # Display basic information
                  print("Table shape:", df1.shape)
                  print("Column names:", df1.columns.tolist())
                  
                  # Check for missing values
                  missing_values = df1.isnull().sum()
                  print("Missing values:")
                  print(missing_values[missing_values > 0] if missing_values.sum() > 0 else "No missing values")
                  
                  # Display summary statistics
                  print("\nSummary statistics:")
                  df1.describe()
        - if: table_count == "Multiple tables"
          then:
            actions:
              - if: multiple_tables_format == "CSVs"
                then:
                  actions:
                    - if: csv_join_possibility == "All can be joined on a common ID column"
                      then:
                        actions:
                          - leaf_id: 2
                            cell_title: "Merge CSVs with Common ID"
                            cell_content: |
                              # Merge multiple CSV files on a common ID column
                              print(f"Merging datasets on column: {common_id_column}")
                              
                              # Check if the common ID column exists in both datasets
                              if common_id_column in df1.columns and common_id_column in df2.columns:
                                  # Perform the merge
                                  merged_df = pd.merge(df1, df2, on=common_id_column, how='inner')
                                  
                                  print(f"Merged dataset shape: {merged_df.shape}")
                                  print(f"Original df1 shape: {df1.shape}, df2 shape: {df2.shape}")
                                  
                                  # Check how many rows were preserved in the merge
                                  print(f"Rows preserved: {merged_df.shape[0]} out of {df1.shape[0]} from df1")
                                  
                                  # Show the first few rows of the merged dataset
                                  merged_df.head()
                              else:
                                  print(f"Error: Common ID column '{common_id_column}' not found in both datasets")
                                  print(f"df1 columns: {df1.columns.tolist()}")
                                  print(f"df2 columns: {df2.columns.tolist()}")
                    - if: csv_join_possibility == "Cannot be joined"
                      then:
                        actions:
                          - leaf_id: 3
                            cell_title: "Handle CSVs That Cannot Be Joined"
                            cell_content: |
                              # Handle CSV files that cannot be joined
                              print("Processing multiple CSV files that cannot be joined...")
                              
                              # Analyze each dataset separately
                              print("\n--- Dataset 1 Analysis ---")
                              print(f"Shape: {df1.shape}")
                              print(f"Columns: {df1.columns.tolist()}")
                              print(f"Missing values: {df1.isnull().sum().sum()}")
                              
                              print("\n--- Dataset 2 Analysis ---")
                              print(f"Shape: {df2.shape}")
                              print(f"Columns: {df2.columns.tolist()}")
                              print(f"Missing values: {df2.isnull().sum().sum()}")
                              
                              print("\nRecommendation: Consider transforming the datasets or defining a common key for joining.")
              - if: multiple_tables_format == "Excel with multiple sheets"
                then:
                  actions:
                    - leaf_id: 4
                      cell_title: "Process Excel with Multiple Sheets"
                      cell_content: |
                        # Process Excel file with multiple sheets
                        print("Processing Excel file with multiple sheets...")
                        
                        # This would normally read from the actual Excel file
                        # For now, we'll simulate with our existing dataframes
                        sheets = {'Sheet1': df1, 'Sheet2': df2}
                        
                        # Display information about each sheet
                        for sheet_name, sheet_data in sheets.items():
                            print(f"\n--- Sheet: {sheet_name} ---")
                            print(f"Shape: {sheet_data.shape}")
                            print(f"Columns: {sheet_data.columns.tolist()}")
                            
                        # Check if sheets can be joined
                        common_columns = set(df1.columns).intersection(set(df2.columns))
                        print(f"\nCommon columns between sheets: {common_columns}")
                        
                        if len(common_columns) > 0:
                            print(f"Sheets could potentially be joined on columns: {common_columns}")
                        else:
                            print("No common columns found for joining sheets.")

