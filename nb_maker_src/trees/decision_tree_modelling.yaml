# Common components
components:
  standard_imports: &standard_imports
    - type: "code"
      content: |
        # Import necessary libraries
        import pandas as pd
        import numpy as np
        import matplotlib.pyplot as plt
        import seaborn as sns
        import torch
        import torch.nn as nn
        import torch.optim as optim
        from sklearn.model_selection import train_test_split
        from sklearn.preprocessing import StandardScaler
        from sklearn.metrics import accuracy_score, classification_report, confusion_matrix
        from sklearn.metrics import mean_squared_error, r2_score, mean_absolute_error
        from torch.utils.data import TensorDataset, DataLoader

  data_preparation: &data_preparation
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Data Preparation and Splitting <span style='color:#F1A424'>|</span></b>
        Splitting the data into training and test sets, and normalizing the features.
    - type: "code"
      content: |
        # Split and preprocess the data
        X_train, X_test, y_train, y_test = train_test_split(df.drop(columns=['$target_column$']), df['$target_column$'], test_size=0.2, random_state=42)

        # Scale features for better model performance
        scaler = StandardScaler()
        X_train_scaled = scaler.fit_transform(X_train)
        X_test_scaled = scaler.transform(X_test)
  tensor_conversion: &tensor_conversion
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Tensor Conversion <span style='color:#F1A424'>|</span></b>
        Converting the data into PyTorch tensors.
    - type: "code"
      content: |
        # Convert data to PyTorch tensors
        X_train_tensor = torch.tensor(X_train_scaled, dtype=torch.float32)
        y_train_tensor = torch.tensor(y_train.values, dtype=torch.float32).reshape(-1, 1)
        X_test_tensor = torch.tensor(X_test_scaled, dtype=torch.float32)
        y_test_tensor = torch.tensor(y_test.values, dtype=torch.float32).reshape(-1, 1)

  model_evaluation: &model_evaluation
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Model Evaluation <span style='color:#F1A424'>|</span></b>
        Evaluating the model's performance on the test set.
    - type: "code"
      content: |
        # Evaluate the model
        model.eval()
        with torch.no_grad():
            y_pred = model(X_test_tensor)
            
            # Calculate metrics
            mse = mean_squared_error(y_test, y_pred)
            rmse = np.sqrt(mse)
            mae = mean_absolute_error(y_test, y_pred)
            r2 = r2_score(y_test, y_pred)
            
            print(f'MSE: {mse:.4f}')
            print(f'RMSE: {rmse:.4f}')
            print(f'MAE: {mae:.4f}')
            print(f'R² Score: {r2:.4f}')

  plot_learning_curve: &plot_learning_curve
