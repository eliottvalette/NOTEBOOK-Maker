  xgboost_model: &xgboost_model
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> XGBoost Model Setup <span style='color:#F1A424'>|</span></b>
        Initialization and configuration of the XGBoost model for multiclass classification.
    - type: "code"
      content: |
        import xgboost as xgb
        
        # Create DMatrix for XGBoost
        dtrain = xgb.DMatrix(X_train_scaled, label=y_train)
        dtest = xgb.DMatrix(X_test_scaled, label=y_test)
        
        # Set parameters for XGBoost
        params = {
            'objective': 'multi:softmax',
            'num_class': '$num_classes$',
            'max_depth': 6,
            'eta': 0.1,
            'subsample': 0.8,
            'colsample_bytree': 0.8,
            'min_child_weight': 1,
            'eval_metric': 'mlogloss'
        }

  xgboost_training: &xgboost_training
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> XGBoost Training & Evaluation <span style='color:#F1A424'>|</span></b>
        Training the XGBoost model with early stopping and evaluating its performance.
    - type: "code"
      content: |
        # Train the model with early stopping
        num_rounds = 1000
        eval_list = [(dtrain, 'train'), (dtest, 'eval')]
        model = xgb.train(params, dtrain, num_rounds, eval_list,
                       early_stopping_rounds=20, verbose_eval=100)
        
        # Make predictions and evaluate
        y_pred = model.predict(dtest)
        accuracy = accuracy_score(y_test, y_pred)
        print(f"Accuracy: {accuracy:.4f}")
        print("\nClassification Report:")
        print(classification_report(y_test, y_pred))

  xgboost_visualization: &xgboost_visualization
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> XGBoost Visualization <span style='color:#F1A424'>|</span></b>
        Confusion matrix and feature importance for the XGBoost model.
    - type: "code"
      content: |
        # Plot confusion matrix
        plt.figure(figsize=(10, 8))
        cm = confusion_matrix(y_test, y_pred)
        sns.heatmap(cm, annot=True, fmt='d', cmap='Blues')
        plt.xlabel('Predicted')
        plt.ylabel('True')
        plt.title('Confusion Matrix')
        plt.show()

        # Feature importance visualization
        plt.figure(figsize=(14, 8))
        importance = model.get_score(importance_type='gain')
        features = list(importance.keys())
        scores = list(importance.values())
        indices = np.argsort(scores)[-20:]
        
        colors = plt.cm.viridis(np.linspace(0, 0.9, len(indices)))
        plt.barh(range(len(indices)), [scores[i] for i in indices], color=colors)
        plt.yticks(range(len(indices)), [features[i] for i in indices])
        plt.xlabel('Importance (gain)')
        plt.ylabel('Features')
        plt.title(f'Top {min(20, len(features))} Feature Importance')
        plt.grid(axis='x', linestyle='--', alpha=0.6)
        
        for i, v in enumerate([scores[idx] for idx in indices]):
            plt.text(v + 0.1, i, f"{v:.2f}", va='center')
        
        plt.tight_layout()
        plt.show()

  neural_net_model: &neural_net_model
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Neural Network Architecture <span style='color:#F1A424'>|</span></b>
        Definition of the neural network architecture for regression.
    - type: "code"
      content: |
        class NeuralNetModel(nn.Module):
            def __init__(self, input_size):
                super(NeuralNetModel, self).__init__()
                self.fc1 = nn.Linear(input_size, 128)
                self.fc2 = nn.Linear(128, 64)
                self.fc3 = nn.Linear(64, 32)
                self.fc4 = nn.Linear(32, 1)
                self.relu = nn.ReLU()
                self.dropout = nn.Dropout(0.2)
                self.bn1 = nn.BatchNorm1d(128)
                self.bn2 = nn.BatchNorm1d(64)
                self.bn3 = nn.BatchNorm1d(32)
            
            def forward(self, x):
                x = self.relu(self.bn1(self.fc1(x)))
                x = self.dropout(x)
                x = self.relu(self.bn2(self.fc2(x)))
                x = self.dropout(x)
                x = self.relu(self.bn3(self.fc3(x)))
                x = self.fc4(x)
                return x

  time_series_preprocessing: &time_series_preprocessing
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Time Series Preprocessing <span style='color:#F1A424'>|</span></b>
        Preprocessing of time series data: splitting, normalization, and extraction of features and target.
    - type: "code"
      content: |
        # Check for any missing values
        print(f"Missing values in dataset: {df.isna().sum().sum()}")

        # Split into features and target
        X = df.drop(columns=['$target_column$'])
        y = df['$target_column$']

        # Scale features
        scaler_X = StandardScaler()
        X_scaled = scaler_X.fit_transform(X)

        # Scale target
        y_mean = y.mean()
        y_std = y.std()
        print(f"Target statistics - Mean: {y_mean:.4f}, Std: {y_std:.4f}")
        y_scaled = (y - y_mean) / y_std

  create_sequences: &create_sequences
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Sequence Creation <span style='color:#F1A424'>|</span></b>
        Creating sequences for sequential learning (LSTM).
    - type: "code"
      content: |
        def create_sequences(X, y, seq_length):
            xs, ys = [], []
            for i in range(len(X) - seq_length):
                xs.append(X[i:i+seq_length])
                ys.append(y[i+seq_length])
            return np.array(xs), np.array(ys)

        # Create sequences
        seq_length = 10
        X_seq, y_seq = create_sequences(X_scaled, y_scaled, seq_length)
        print(f"Sequence shapes: X = {X_seq.shape}, y = {y_seq.shape}")

        # Split into training and test sets
        train_size = int(len(X_seq) * 0.8)
        X_train, X_test = X_seq[:train_size], X_seq[train_size:]
        y_train, y_test = y_seq[:train_size], y_seq[train_size:]

        # Convert to PyTorch tensors
        X_train_tensor = torch.FloatTensor(X_train)
        y_train_tensor = torch.FloatTensor(y_train).reshape(-1, 1)
        X_test_tensor = torch.FloatTensor(X_test)
        y_test_tensor = torch.FloatTensor(y_test).reshape(-1, 1)

        print(f"Training data: X = {X_train_tensor.shape}, y = {y_train_tensor.shape}")
        print(f"Test data: X = {X_test_tensor.shape}, y = {y_test_tensor.shape}")

  lstm_model: &lstm_model
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> LSTM Model Architecture <span style='color:#F1A424'>|</span></b>
        Definition of the LSTM model architecture for time series forecasting.
    - type: "code"
      content: |
        class LSTMModel(nn.Module):
            def __init__(self, input_size, hidden_size, num_layers=2, dropout=0.2):
                super(LSTMModel, self).__init__()
                self.hidden_size = hidden_size
                self.num_layers = num_layers
                
                self.lstm = nn.LSTM(
                    input_size=input_size,
                    hidden_size=hidden_size,
                    num_layers=num_layers,
                    batch_first=True,
                    dropout=dropout
                )
                
                self.fc1 = nn.Linear(hidden_size, hidden_size // 2)
                self.relu = nn.ReLU()
                self.dropout = nn.Dropout(dropout)
                self.fc2 = nn.Linear(hidden_size // 2, 1)
                
            def forward(self, x):
                batch_size = x.size(0)
                h0 = torch.zeros(self.num_layers, batch_size, self.hidden_size).to(x.device)
                c0 = torch.zeros(self.num_layers, batch_size, self.hidden_size).to(x.device)
                
                lstm_out, _ = self.lstm(x, (h0, c0))
                
                out = self.fc1(lstm_out[:, -1, :])
                out = self.relu(out)
                out = self.dropout(out)
                out = self.fc2(out)
                
                return out

  lstm_training_setup: &lstm_training_setup
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> LSTM Training Setup <span style='color:#F1A424'>|</span></b>
        LSTM model configuration, loss, optimizer, and DataLoader setup.
    - type: "code"
      content: |
        # Model configuration
        input_size = X_train.shape[2]
        hidden_size = 128
        num_layers = 2
        dropout = 0.2

        # Create model and training components
        model = LSTMModel(input_size, hidden_size, num_layers, dropout)
        criterion = nn.MSELoss()
        optimizer = optim.Adam(model.parameters(), lr=0.001, weight_decay=1e-5)
        scheduler = optim.lr_scheduler.ReduceLROnPlateau(optimizer, 'min', factor=0.5, patience=5)

        # Create DataLoader
        batch_size = 64
        train_dataset = TensorDataset(X_train_tensor, y_train_tensor)
        train_loader = DataLoader(dataset=train_dataset, batch_size=batch_size, shuffle=True)

  training_loop: &training_loop
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Training Loop <span style='color:#F1A424'>|</span></b>
        Training loop with early stopping and saving the best model.
    - type: "code"
      content: |
        # Training parameters
        num_epochs = 200
        patience = 15
        best_loss = float('inf')
        counter = 0
        train_losses = []
        val_losses = []
        
        # Training loop
        for epoch in range(num_epochs):
            model.train()
            epoch_loss = 0
            
            for batch_X, batch_y in train_loader:
                outputs = model(batch_X)
                loss = criterion(outputs, batch_y)
                
                optimizer.zero_grad()
                loss.backward()
                torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)
                optimizer.step()
                
                epoch_loss += loss.item()
            
            avg_train_loss = epoch_loss / len(train_loader)
            train_losses.append(avg_train_loss)
            
            # Validation
            model.eval()
            with torch.no_grad():
                val_outputs = model(X_test_tensor)
                val_loss = criterion(val_outputs, y_test_tensor)
                val_losses.append(val_loss.item())
                
                scheduler.step(val_loss)
                
                if val_loss < best_loss:
                    best_loss = val_loss
                    counter = 0
                    torch.save(model.state_dict(), 'best_lstm_model.pth')
                else:
                    counter += 1
            
            if counter >= patience:
                print(f'Early stopping triggered at epoch {epoch+1}')
                break
            
            if (epoch+1) % 10 == 0:
                print(f'Epoch [{epoch+1}/{num_epochs}], Train Loss: {avg_train_loss:.4f}, Val Loss: {val_loss.item():.4f}')
        
        # Load best model
        model.load_state_dict(torch.load('best_lstm_model.pth'))

  plot_results: &plot_results
    - type: "markdown"
      content: |
        # <b><span style='color:#F1A424'>|</span> Final Results <span style='color:#F1A424'>|</span></b>
        Visualization of the learning curve and final model predictions.
    - type: "code"
      content: |
        # Plot results
        plt.figure(figsize=(12, 5))

        # Plot learning curve
        plt.subplot(1, 2, 1)
        plt.plot(train_losses)
        plt.plot(val_losses)
        plt.title('Learning Curve')
        plt.xlabel('Epoch')
        plt.ylabel('Loss')
        plt.legend(['Train', 'Validation'])

        # Plot predictions vs actual
        plt.subplot(1, 2, 2)
        plt.scatter(y_test, y_pred, alpha=0.3)
        plt.plot([y_test.min(), y_test.max()], [y_test.min(), y_test.max()], 'r--')
        plt.title('Predictions vs Actual')
        plt.xlabel('Actual')
        plt.ylabel('Predicted')

        plt.tight_layout()
        plt.show()

