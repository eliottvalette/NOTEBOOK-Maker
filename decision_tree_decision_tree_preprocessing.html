<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Decision Tree Visualization</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/dist/vis-network.min.css" rel="stylesheet" type="text/css" />
    <style type="text/css">
        #mynetwork {
            width: 100%;
            height: 800px;
            border: 1px solid lightgray;
            background-color: #f9f9f9;
        }
        .vis-tooltip {
            position: absolute;
            visibility: hidden;
            padding: 5px;
            white-space: nowrap;
            font-family: verdana;
            font-size: 14px;
            color: #000000;
            background-color: #f5f4ed;
            -moz-border-radius: 3px;
            -webkit-border-radius: 3px;
            border-radius: 3px;
            border: 1px solid #808074;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            word-break: break-word;
        }
        h1 {
            font-family: Arial, sans-serif;
            color: #333;
            text-align: center;
        }
        .info {
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Decision Tree Visualization</h1>
    <div class="info">
        <p><strong>Instructions:</strong> You can zoom in/out with the mouse wheel, move the graph by holding the left click, and see details by hovering over nodes.</p>
    </div>

    <div id="mynetwork"></div>

    <script type="text/javascript">
        var container = document.getElementById('mynetwork');
        var data = {
            nodes: new vis.DataSet([{"id": "root_node", "label": "Data Type", "title": "Starting point of the decision tree", "color": "#FFD700", "shape": "ellipse", "font": {"size": 16, "bold": true}}, {"id": "top_level_0", "label": "Tabular data only", "title": "Main condition: Tabular data only", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "decision_100", "label": "One table", "title": "Condition: One table", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "decision_101", "label": "CSV", "title": "Condition: CSV", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "decision_102", "label": "Has headers", "title": "Condition: Has headers", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_1", "label": "Process Single Table\n(ID: 1)", "title": "<div style='max-width:300px'><h3>Process Single Table</h3><p><b>ID:</b> 1</p><p><b>Arguments:</b> csv_filename</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "leaf_2", "label": "Process Single Table\n(ID: 2)", "title": "<div style='max-width:300px'><h3>Process Single Table</h3><p><b>ID:</b> 2</p><p><b>Arguments:</b> csv_filename</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_103", "label": "Excel", "title": "Condition: Excel", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "decision_104", "label": "Multiple sheets", "title": "Condition: Multiple sheets", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_3", "label": "Error, Should have said multiple tables\n(ID: 3)", "title": "<div style='max-width:300px'><h3>Error, Should have said multiple tables</h3><p><b>ID:</b> 3</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "leaf_4", "label": "Process Excel Table\n(ID: 4)", "title": "<div style='max-width:300px'><h3>Process Excel Table</h3><p><b>ID:</b> 4</p><p><b>Arguments:</b> excel_filename</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_105", "label": "Parquet", "title": "Condition: Parquet", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_5", "label": "Process Parquet Table\n(ID: 5)", "title": "<div style='max-width:300px'><h3>Process Parquet Table</h3><p><b>ID:</b> 5</p><p><b>Arguments:</b> parquet_filename</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_106", "label": "JSON", "title": "Condition: JSON", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_6", "label": "Process JSON Table\n(ID: 6)", "title": "<div style='max-width:300px'><h3>Process JSON Table</h3><p><b>ID:</b> 6</p><p><b>Arguments:</b> json_filename</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_107", "label": "SQL", "title": "Condition: SQL", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_7", "label": "Process SQL Table\n(ID: 7)", "title": "<div style='max-width:300px'><h3>Process SQL Table</h3><p><b>ID:</b> 7</p><p><b>Arguments:</b> sql_connection_string, table_name</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_108", "label": "Multiple tables", "title": "Condition: Multiple tables", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "decision_109", "label": "All CSV", "title": "Condition: All CSV", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "decision_110", "label": "Can join on common ID", "title": "Condition: Can join on common ID", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_8", "label": "Merge CSVs on Common ID\n(ID: 8)", "title": "<div style='max-width:300px'><h3>Merge CSVs on Common ID</h3><p><b>ID:</b> 8</p><p><b>Arguments:</b> csv_filenames_list, common_id_column</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_111", "label": "All have same row count", "title": "Condition: All have same row count", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_9", "label": "Merge CSVs By Concatenation\n(ID: 9)", "title": "<div style='max-width:300px'><h3>Merge CSVs By Concatenation</h3><p><b>ID:</b> 9</p><p><b>Arguments:</b> csv_filenames_list</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_112", "label": "No common ID and not all have same row count", "title": "Condition: No common ID and not all have same row count", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_10", "label": "Multiple CSVs Without Join Possible\n(ID: 10)", "title": "<div style='max-width:300px'><h3>Multiple CSVs Without Join Possible</h3><p><b>ID:</b> 10</p><p><b>Arguments:</b> csv_filenames_list</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_113", "label": "Excel with multiple sheets", "title": "Condition: Excel with multiple sheets", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_11", "label": "Process Excel with Multiple Sheets\n(ID: 11)", "title": "<div style='max-width:300px'><h3>Process Excel with Multiple Sheets</h3><p><b>ID:</b> 11</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_114", "label": "Mixed formats (CSV + Excel)", "title": "Condition: Mixed formats (CSV + Excel)", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_12", "label": "Mixed File Types Preprocessing\n(ID: 12)", "title": "<div style='max-width:300px'><h3>Mixed File Types Preprocessing</h3><p><b>ID:</b> 12</p><p><b>Arguments:</b> csv_filenames_list</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "top_level_1", "label": "Images only", "title": "Main condition: Images only", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "decision_200", "label": "JPEG format", "title": "Condition: JPEG format", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_13", "label": "Process JPEG Images\n(ID: 13)", "title": "<div style='max-width:300px'><h3>Process JPEG Images</h3><p><b>ID:</b> 13</p><p><b>Arguments:</b> image_folder</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "decision_201", "label": "PNG format", "title": "Condition: PNG format", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_14", "label": "Process PNG Images\n(ID: 14)", "title": "<div style='max-width:300px'><h3>Process PNG Images</h3><p><b>ID:</b> 14</p><p><b>Arguments:</b> image_folder</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}, {"id": "top_level_2", "label": "Images and tabular data", "title": "Main condition: Images and tabular data", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "decision_300", "label": "Images mapped to tabular rows", "title": "Condition: Images mapped to tabular rows", "color": "#D2E5FF", "shape": "diamond", "font": {"size": 14}}, {"id": "leaf_15", "label": "Multimodal Preprocessing\n(ID: 15)", "title": "<div style='max-width:300px'><h3>Multimodal Preprocessing</h3><p><b>ID:</b> 15</p><p><b>Arguments:</b> csv_filename, image_folder</p></div>", "color": "#C5E8B7", "shape": "box", "font": {"size": 14, "bold": true}}]),
            edges: new vis.DataSet([{"from": "root_node", "to": "top_level_0", "arrows": "to"}, {"from": "root_node", "to": "top_level_1", "arrows": "to"}, {"from": "root_node", "to": "top_level_2", "arrows": "to"}, {"from": "top_level_0", "to": "decision_100", "arrows": "to"}, {"from": "top_level_0", "to": "decision_108", "arrows": "to"}, {"from": "decision_100", "to": "decision_101", "arrows": "to"}, {"from": "decision_100", "to": "decision_103", "arrows": "to"}, {"from": "decision_100", "to": "decision_105", "arrows": "to"}, {"from": "decision_100", "to": "decision_106", "arrows": "to"}, {"from": "decision_100", "to": "decision_107", "arrows": "to"}, {"from": "decision_101", "to": "decision_102", "arrows": "to"}, {"from": "decision_102", "to": "leaf_1", "arrows": "to"}, {"from": "decision_102", "to": "leaf_2", "arrows": "to"}, {"from": "decision_103", "to": "decision_104", "arrows": "to"}, {"from": "decision_104", "to": "leaf_3", "arrows": "to"}, {"from": "decision_104", "to": "leaf_4", "arrows": "to"}, {"from": "decision_105", "to": "leaf_5", "arrows": "to"}, {"from": "decision_106", "to": "leaf_6", "arrows": "to"}, {"from": "decision_107", "to": "leaf_7", "arrows": "to"}, {"from": "decision_108", "to": "decision_109", "arrows": "to"}, {"from": "decision_108", "to": "decision_113", "arrows": "to"}, {"from": "decision_108", "to": "decision_114", "arrows": "to"}, {"from": "decision_109", "to": "decision_110", "arrows": "to"}, {"from": "decision_109", "to": "decision_111", "arrows": "to"}, {"from": "decision_109", "to": "decision_112", "arrows": "to"}, {"from": "decision_110", "to": "leaf_8", "arrows": "to"}, {"from": "decision_111", "to": "leaf_9", "arrows": "to"}, {"from": "decision_112", "to": "leaf_10", "arrows": "to"}, {"from": "decision_113", "to": "leaf_11", "arrows": "to"}, {"from": "decision_114", "to": "leaf_12", "arrows": "to"}, {"from": "top_level_1", "to": "decision_200", "arrows": "to"}, {"from": "top_level_1", "to": "decision_201", "arrows": "to"}, {"from": "decision_200", "to": "leaf_13", "arrows": "to"}, {"from": "decision_201", "to": "leaf_14", "arrows": "to"}, {"from": "top_level_2", "to": "decision_300", "arrows": "to"}, {"from": "decision_300", "to": "leaf_15", "arrows": "to"}])
        };
        var options = {"nodes": {"font": {"size": 16}, "margin": 10}, "edges": {"color": {"inherit": true}, "smooth": {"enabled": true, "type": "straightCross"}, "arrows": {"to": {"enabled": true, "scaleFactor": 1}}}, "physics": {"enabled": true, "hierarchicalRepulsion": {"centralGravity": 0.0, "springLength": 120, "springConstant": 0.01, "nodeDistance": 250}, "minVelocity": 0.75, "solver": "hierarchicalRepulsion"}, "layout": {"hierarchical": {"enabled": true, "direction": "UD", "sortMethod": "directed", "levelSeparation": 180, "nodeSpacing": 200, "treeSpacing": 200}}, "interaction": {"navigationButtons": true, "keyboard": true}};
        var network = new vis.Network(container, data, options);
        
        network.once('afterDrawing', function() {
            network.fit({
                animation: {
                    duration: 1000,
                    easingFunction: 'easeInOutQuad'
                }
            });
        });
    </script>
</body>
</html>
