form_questions:
  - id: data_type
    question: "What is the nature of your data?"
    type: select
    options:
      - "Tabular data only"
      - "Images and tabular data"
      - "Images only"

  - id: table_count
    question: "How many tables do you have?"
    type: select
    options:
      - "One table"
      - "Multiple tables"
    depends_on: data_type == "Tabular data only"

  - id: multiple_tables_format
    question: "What is the format of your tables?"
    type: select
    options:
      - "CSVs"
      - "Excel with multiple sheets"
    depends_on: table_count == "Multiple tables"

  - id: csv_join_possibility
    question: "Can the CSVs be joined?"
    type: select
    options:
      - "All can be joined on a common ID column"
      - "Cannot be joined"
    depends_on: multiple_tables_format == "CSVs"

  - id: common_id_column
    question: "What is the name of the common ID column?"
    type: string
    depends_on: csv_join_possibility == "All can be joined on a common ID column"
